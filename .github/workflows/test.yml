name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the result of the other.
      fail-fast: false
      matrix:
        # The oldest version the package supports in practice, and the one
        # Ubuntu 24.04 and ROS 2 Jazzy ship.
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its test dependencies
        run: pip install -e '.[test]'

      - name: Run the tests
        run: pytest -q

      - name: Check the code style
        run: flake8
