[metadata]
name = colcon-buildx
version = 0.2.1
url = https://gitlab.com/smarobix/automatica-2025/kria_ros_cross_compile
author = Sergio Pertuz
author_email = sergio@smarobix.com
maintainer = Sergio Pertuz
maintainer_email = sergio@smarobix.com
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Plugins
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Software Development :: Build Tools
license = Apache License, Version 2.0
description = Colcon extension for cross-compilation to embedded ARM64 boards (Docker and SSHFS methods)
long_description = file: README.md
long_description_content_type = text/markdown
keywords = colcon cross-compilation ros2 embedded docker arm64 kria

[options]
python_requires = >=3.8
install_requires =
    colcon-core>=0.7.1
    colcon-cmake>=0.2.1
    PyYAML>=5.1
packages = find:
zip_safe = false
include_package_data = true

[options.extras_require]
test =
    pytest>=6.0
    pytest-cov
    flake8

[options.entry_points]
colcon_core.verb =
    buildx = colcon_buildx.verb.buildx:BuildxVerb

[options.packages.find]
exclude =
    tests
    tests.*
    bin
    bin.*
