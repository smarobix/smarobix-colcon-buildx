[build-system]
# 61 is the first setuptools release that reads [project] metadata (PEP 621).
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "colcon-buildx"
dynamic = ["version"]
description = "A colcon verb that cross-builds ROS 2 workspaces for arm64 and armhf boards, inside a Docker image or against a Yocto/OE SDK"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache License 2.0"}
authors = [
    {name = "SMAROBIX GmbH"},
]
maintainers = [
    {name = "Sergio Pertuz", email = "sergio@smarobix.com"},
]
keywords = [
    "colcon",
    "ros2",
    "cross-compilation",
    "embedded",
    "arm64",
    "armhf",
    "docker",
    "yocto",
    "openembedded",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "colcon-core>=0.7.1",
    "colcon-cmake>=0.2.1",
    "PyYAML>=5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/smarobix/smarobix-colcon-buildx"
Repository = "https://github.com/smarobix/smarobix-colcon-buildx"
Issues = "https://github.com/smarobix/smarobix-colcon-buildx/issues"

# colcon discovers the verb through this group and name; keep both stable.
[project.entry-points."colcon_core.verb"]
buildx = "colcon_buildx.verb.buildx:BuildxVerb"

[tool.setuptools.packages.find]
include = ["colcon_buildx*"]

[tool.setuptools.dynamic]
version = {attr = "colcon_buildx.__version__"}
